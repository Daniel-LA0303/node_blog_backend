sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/test/**,**/*.test.ts,src/index.ts,**/*.d.ts
sonar.typescript.tsconfigPaths=tsconfig.sonar.json